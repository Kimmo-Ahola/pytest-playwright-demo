name: Split pipeline with unit and E2E Tests

on:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit_tests
  
  e2e:
    needs: unit
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run E2E tests
        run: pytest -m e2e